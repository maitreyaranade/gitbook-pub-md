name: Build Professional PDFs

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Build PDFs
        run: |
          mkdir -p site

          folders="DataScience DigitalLogicDesign FPGADesign FPGAInterview FPGAPeripherals FPGAProtocols HLS ImageProcessing ProgrammingLanguages SemiconductorDevices StaticTimingAnalysis VerilogHDL Vitis"

          for dir in $folders
          do
            echo "Building $dir..."

            cd "$dir"
            files="$dir.md"
            linked=$(grep -oP '\(([^)]+\.md)\)' "$dir.md" | tr -d '()')
            for f in $linked
            do
              if [ -f "$f" ]; then
                files="$files $f"
              fi
            done

            pandoc $files \
              -o "../site/$dir.pdf" \
              --toc \
              --number-sections \
              --pdf-engine=xelatex \
              --syntax-highlighting=idiomatic \
              --resource-path=. \
              -V geometry:margin=1in \
              -V fontsize=11pt

            cd ..
          done

      - name: Create Download Page
        run: |
          echo "<h1>PDF Library</h1><ul>" > site/index.html
          for f in site/*.pdf; do
            name=$(basename "$f")
            echo "<li><a href=\"$name\">$name</a></li>" >> site/index.html
          done
          echo "</ul>" >> site/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site